spring.application.name=biuwendyecommerce
server.port=8086
# Configuración de SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=bsEcomerce01;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=Jabroca23
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyHbmImpl

# Permite que la aplicación intente levantar aunque haya hilos pendientes
spring.main.allow-bean-definition-overriding=true

# Desactiva el LiveReload si usas una API REST (a veces duplica hilos en el puerto)
spring.devtools.livereload.enabled=false

# Forzar un apagado rápido del servidor embebido para liberar el puerto inmediatamente
server.shutdown=immediate

# Configurar un tiempo de espera máximo para que las conexiones viejas mueran
spring.lifecycle.timeout-per-shutdown-phase=2s

# Evitar que DevTools mantenga patrones de escaneo duplicados en memoria
spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=1s

# 1. Corrige el aviso de "SQLServerDialect does not need to be specified explicitly"
# Elimina o comenta tu línea anterior de dialecto y deja que Spring la autodetecte:
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# 2. Corrige el aviso de "spring.jpa.open-in-view is enabled by default"
# Esto evita mantener conexiones abiertas innecesariamente hacia SQL Server
spring.jpa.open-in-view=false

# Evita que Tomcat obligue el uso de HTTPS/SSL localmente
server.ssl.enabled=false