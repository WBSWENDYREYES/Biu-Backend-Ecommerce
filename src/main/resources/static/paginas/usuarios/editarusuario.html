    <!--begin::Theme Init (prevents flash of incorrect theme on load, #6043)-->
    <script>
      (() => {
        'use strict';
        const root = document.documentElement;

        // Applications with their own theming opt out of AdminLTE's color mode
        // entirely, here as well as in the bundle.
        if (root.getAttribute('data-lte-color-mode') === 'off') {
          return;
        }

        const STORAGE_KEY = 'lte-theme';
        let stored = null;
        try {
          stored = localStorage.getItem(STORAGE_KEY);
        } catch {
          // localStorage may be unavailable (private mode, sandboxed iframe).
        }
        // Mirror the precedence in color-mode.ts: the visitor's stored choice
        // wins, then a theme this page declared itself, then the OS preference.
        const authored = root.getAttribute('data-bs-theme');
        let resolved = 'light';
        if (stored === 'dark' || stored === 'light') {
          resolved = stored;
        } else if (authored === 'dark' || authored === 'light') {
          resolved = authored;
        } else if (globalThis.matchMedia('(prefers-color-scheme: dark)').matches) {
          resolved = 'dark';
        }
        root.setAttribute('data-bs-theme', resolved);
        root.style.colorScheme = resolved;
        // Flag values computed here, so the bundle does not mistake them for a
        // theme the page declared and stop following the OS preference.
        if (resolved !== authored) {
          root.setAttribute('data-lte-theme-resolved', '');
        }
      })();
    </script>

<script>
document.addEventListener("DOMContentLoaded", () => {
 const usuarioId = localStorage.getItem('usuarioId'); 
    if (!usuarioId) {
        alert("Error: No se encontró una sesión activa de usuario.");
        window.location.href = '/login.html';
        return;
    }

    // 1. Controlar el entorno del iframe antes de iniciar
//inicializarFormulario();
    // 2. Cargar los selectores de inmediato (En paralelo)
document.getElementById('btn-guardar-usuario').addEventListener('click', () => {
  const idusuario = document.getElementById('Idusuario').value.trim();
  const nombre = document.getElementById('nombreUsuario').value.trim();
  const telefonos = document.getElementById('telefonosUsuario').value.trim();
  const email = document.getElementById('emailUsuario').value.trim();
  const idroles = document.getElementById('idroles').value.trim();
  const password = document.getElementById('passwordUsuario').value.trim();
  const password1 = document.getElementById('passwordUsuario1').value.trim();
 
    if (!nombre) {
        alert("El nombre del usuario es obligatorio");
        return;
    }
        if (!email) {
        alert("El email del usuario es obligatorio");
        return;
    }
    if (password != password1)
    {
      alert("Tiene que confirmar la Clave . . .");
      return;
    }
    const usuarioId = localStorage.getItem('usuarioRol');
    
    //alert(usuarioId+ " "+nombre+ " "+telefonos+email+" "+password+" "+idroles);
    if (!usuarioId) {
        alert("Error: No se encontró una sesión activa de usuario.");
        window.location.href = '/login.html';
        return;
    }
    // Enviamos los datos al servidor
    fetch('/api/usuarios/SalvarUsuario', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({ id : parseInt(idusuario), nombre: nombre,
            telefonos: telefonos,
            email: email,
            password: password,Rol : parseInt(idroles),
            usuarioId: parseInt(usuarioId) })
    })
    .then(response => {
        //  SI EL SERVIDOR DEVUELVE 403 (FORBIDDEN), SIGNIFICA QUE NO ES ADMIN
        if (response.status === 403) {
            throw new Error("Acceso denegado: Solo los administradores pueden crear Categorias.");
        }
        if (!response.ok) {
            throw new Error("Hubo un error al guardar la categoría."+response.message);
        }
        return response.json();
    })
    .then(data => {
      //  alert("Categoría guardada con éxito!");
        
        // Si tienes una tabla de marcas, aquí la refrescas:
     //    cargarDatosUsuarios(); 

    })
    .catch(error => {
        // Aquí atrapamos el error 403 y se lo mostramos al usuario
        alert(error.message);
    });
});


});
