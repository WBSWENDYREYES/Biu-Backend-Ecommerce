    <!--begin::Theme Init (prevents flash of incorrect theme on load, #6043)-->
    <script>
      (() => {
        'use strict';
        const root = document.documentElement;

        // Applications with their own theming opt out of AdminLTE's color mode
        // entirely, here as well as in the bundle.
        if (root.getAttribute('data-lte-color-mode') === 'off') {
          return;
        }

        const STORAGE_KEY = 'lte-theme';
        let stored = null;
        try {
          stored = localStorage.getItem(STORAGE_KEY);
        } catch {
          // localStorage may be unavailable (private mode, sandboxed iframe).
        }
        // Mirror the precedence in color-mode.ts: the visitor's stored choice
        // wins, then a theme this page declared itself, then the OS preference.
        const authored = root.getAttribute('data-bs-theme');
        let resolved = 'light';
        if (stored === 'dark' || stored === 'light') {
          resolved = stored;
        } else if (authored === 'dark' || authored === 'light') {
          resolved = authored;
        } else if (globalThis.matchMedia('(prefers-color-scheme: dark)').matches) {
          resolved = 'dark';
        }
        root.setAttribute('data-bs-theme', resolved);
        root.style.colorScheme = resolved;
        // Flag values computed here, so the bundle does not mistake them for a
        // theme the page declared and stop following the OS preference.
        if (resolved !== authored) {
          root.setAttribute('data-lte-theme-resolved', '');
        }
      })();
    </script>

document.getElementById('btn-guardar-categoria').addEventListener('click', () => {
    const nombre = document.getElementById('nombreCategoria').value.trim();
    const idcategoria = document.getElementById('idCategoria').value.trim();
   
    if (!nombre) {
        alert("El nombre de la categoría es obligatorio");
        return;
    }
    const usuarioId = localStorage.getItem('usuarioId'); 
    if (!usuarioId) {
        alert("Error: No se encontró una sesión activa de usuario.");
        window.location.href = '/login.html';
        return;
    }
    // Enviamos los datos al servidor
    fetch('/api/categorias/salvarCategoria', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },

         
        body: JSON.stringify({id: idcategoria, nombre: nombre,
            usuarioId: parseInt(usuarioId) })
    })
    .then(response => {
        //  SI EL SERVIDOR DEVUELVE 403 (FORBIDDEN), SIGNIFICA QUE NO ES ADMIN
        if (response.status === 403) {
            throw new Error("Acceso denegado: Solo los administradores pueden crear Categorias.");
        }
        if (!response.ok) {
            throw new Error("Hubo un error al guardar la categoría.");
        }
        return response.json();
    })
    .then(data => {
      //  alert("Categoría guardada con éxito!");
        modalCategoria.hide(); // Cerramos la ventana modal
        
        // Si tienes una tabla de marcas, aquí la refrescas:

       cargarDatosCategorias(); // Recargamos la tabla de categorías

    })
    .catch(error => {
        // Aquí atrapamos el error 403 y se lo mostramos al usuario
        alert(error.message);
    });
});

        let data = [];
const table = new Tabulator('#users-table', {
  data: data,
  layout: 'fitColumns',
  pagination: true,
  paginationSize: 10,
  paginationSizeSelector: [10, 25, 50, 100],
  movableColumns: true,
  locale: true,
  langs: {
    "default": { // Configuramos el idioma por defecto
      "pagination": {
        "first": "<i class='bi bi-chevron-double-left'></i>", // Icono Primero
        "prev": "<i class='bi bi-chevron-left'></i>",          // Icono Anterior
        "next": "<i class='bi bi-chevron-right'></i>",         // Icono Siguiente
        "last": "<i class='bi bi-chevron-double-right'></i>", // Icono Último
        "counter": {
          "showing": "Mostrando",
          "of": "de",
          "rows": "filas",
        }
      }
    }
  },
  
  // 1. DESACTIVAR SELECCIÓN MÚLTIPLE DE RAÍZ
  selectable: 1, 
  selectableRangeMode: "none", // Desactiva que el mouse marque rangos al arrastrar

  // 2. DETECTAR EL EVENTO DE SELECCIÓN DIRECTAMENTE
  rowSelected: function(row){
    // Si el usuario selecciona una fila, este método deselecciona las demás de forma inmediata
    const rows = table.getSelectedRows();
    if(rows.length > 1){
       rows.forEach(r => {
          if(r !== row) r.deselect(); // Mantiene únicamente la última fila marcada
       });
    }
    document.getElementById('btn-editar').disabled = false;
  },

  columns: [
    {
      // 3. CAMBIO DE FORMATEADOR: Usamos "tickCross" en lugar de "rowSelection" para romper el bucle múltiple
      formatter: function(cell){
         return cell.getRow().isSelected() ? "☑" : "☐";
      }, 
      hozAlign: "center", 
      headerSort: false, 
      width: 50,
      cellClick: function(e, cell) {
         // Al hacer click sobre el cuadrito, forzamos la selección única de esa fila
    const fila = cell.getRow();
         
         // 1. Si la fila YA está seleccionada, la deseleccionamos
         if (fila.isSelected()) {
             fila.deselect();
         } else {
             // 2. Si NO está seleccionada, limpiamos la tabla y la seleccionamos
             table.deselectRow();
             fila.select();
         }      }
    },
    { title: '#', field: 'id', width: 60, headerSort: true },
    { title: 'Nombre', field: 'Nombre', headerFilter: 'input' },
   
  ],
});
