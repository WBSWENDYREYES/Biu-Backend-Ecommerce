<title>WENDY E-COMERCE SERVICES</title>
</head>
<body>
  
      <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
            
                <div class="card-header"><img class="img-fluid" src="/assets/images/logowendy.png" /> </div>
                <div class="card-body">
                    
                    
         <form id="loginForm">
      <!--ES MUY IMPORTANTE QUE EL ACCION SE LLAME ASI-->
        
        
        
        <div class="container"><!-- Permite centrar el contenido -->
            <div class="row">
                <div class="col-md-12"> &nbsp; </div>
            </div>
            <div class="row">
                <div class="col-md-12"> &nbsp; </div>
            </div>
            <div class="row">
                <div class="col-md-12"> &nbsp; </div>
            </div>
            <div class="panel panel-primary" >
                <div class="panel-heading">
                    <h2 class="panel-title"><label>Iniciar sesión:</label> </h2>
                </div>
                <div class="panel-body">        

                    
                    		<div class="form-floating mb-3">
							<input class="form-control" id="useremail"  name="useremail" type="email"
								placeholder="name@example.com"
								data-sb-validations="required,email" /> <label for="useremail">Email
								address</label>
							<div class="invalid-feedback" data-sb-feedback="email:required">An
								email is requirido.</div>
							<div class="invalid-feedback" data-sb-feedback="email:email">Email
								no es válido.</div>
						</div>
						
                    		<div class="form-floating mb-3">
							<input class="form-control" id="userpassword" name="userpassword" type="password"
								placeholder="name@example.com"
								data-sb-validations="required,password" /> <label for="userpassword">password
								</label>
							<div class="invalid-feedback" data-sb-feedback="email:required">Contraseña es
								requirida.</div>
							<div class="invalid-feedback" data-sb-feedback="email:email">Contraseña
								no es válida.</div>
						</div>
						               
                    <div class="row">
                        <div class="col-md-12"> &nbsp; </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12 center">
                            <input type="submit" value="Iniciar sesión" class="btn btn-primary btn-ld" >
                        </div>
                    </div>
                </div>
            </div>  
       </div>
    </form>
                       

                </div>
            </div>
        </div>
    </div>


        <!-- 🌐 SCRIPT DE AJAX PARA LLAMAR A LA API REST -->
    <script>
        $(document).ready(function() {
            // Detecta cuando el usuario hace clic en el botón submit del formulario
$('#loginForm').on('submit', function(e) {
                e.preventDefault(); // Detiene el refresco automático de la página
               
                // Ocultar alertas previas
                $('#errorAlert').addClass('d-none').text('');

                // Captura los valores de las cajas de texto
                const txtEmail = $('#useremail').val();
                const txtPassword = $('#userpassword').val();
                // Realiza la llamada asíncrona mediante jQuery AJAX
console.log("EMAIL:", txtEmail);
console.log("PASSWORD:", txtPassword);
console.log("LLAMANDO AL LOGIN");

               fetch('/api/usuarios/login', {
    method: 'POST',
    headers: {
        'Content-Type': 'application/json'
    },
    body: JSON.stringify({
        email: txtEmail,
        password: txtPassword
    })
})
.then(response => response.text())
.then(data => {
    console.log("RESPUESTA DEL SERVIDOR:", data);
   localStorage.setItem(
        "usuario",data );
  const datosUsuario = localStorage.getItem("usuario");
   const usuario = JSON.parse(datosUsuario);         
     localStorage.setItem('usuarioId',usuario.Id);
     localStorage.setItem('usuarioRol',usuario.idroles);
     localStorage.setItem('usuarioNombre',usuario.nombre);        


        window.location.href = '/index.html'; // Redirección a la vista de acceso
        return;
})
.catch(error => {
    console.error("ERROR:", error);
    alert(error.message);
});
   
});            });
    </script>

</body>
</html>
