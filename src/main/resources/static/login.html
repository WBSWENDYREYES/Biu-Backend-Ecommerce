<body>
  
      <div class="row justify-content-center">

                <div class="card-header"><img class="img-fluid" src="/assets/images/logowendy.png" /> </div>

         <form id="loginForm">
      <!--ES MUY IMPORTANTE QUE EL ACCION SE LLAME ASI-->
        
        
        
        <div class="container"><!-- Permite centrar el contenido -->
            <div class="row">
                <div class="col-md-12"> &nbsp; </div>
            </div>
            <div class="row">
                <div class="col-md-12"> &nbsp; </div>
            </div>
            <div class="row">
                <div class="col-md-12"> &nbsp; </div>
            </div>
            <div class="panel panel-primary" >
                <div class="panel-heading">
                    <h2 class="panel-title"><label>Iniciar sesión:</label> </h2>
                </div>
                <div class="panel-body">        

                    
                    		<div class="form-floating mb-3">
							<input class="form-control" id="email"  name="email" type="email"
								placeholder="name@example.com"
								data-sb-validations="required,email" /> <label for="email">Email
								address</label>
							<div class="invalid-feedback" data-sb-feedback="email:required">An
								email is requirido.</div>
							<div class="invalid-feedback" data-sb-feedback="email:email">Email
								no es válido.</div>
						</div>
						
                    		<div class="form-floating mb-3">
							<input class="form-control" id="password" name="password" type="password"
								placeholder="name@example.com"
								data-sb-validations="required,password" /> <label for="email">password
								</label>
							<div class="invalid-feedback" data-sb-feedback="email:required">Contraseña es
								requirida.</div>
							<div class="invalid-feedback" data-sb-feedback="email:email">Contraseña
								no es válida.</div>
						</div>
						               
                    <div class="row">
                        <div class="col-md-12"> &nbsp; </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12 center">
                            <input type="submit" value="Iniciar sesión" class="btn btn-primary btn-ld" >
                        </div>
                    </div>
                </div>
            </div>  
       </div>
    </form>
                       

                </div>
            </div>
        </div>
    </div>


        <!-- 🌐 SCRIPT DE AJAX PARA LLAMAR A LA API REST -->
    <script>
        $(document).ready(function() {
            // Detecta cuando el usuario hace clic en el botón submit del formulario
            $('#loginForm').on('submit', function(e) {
                e.preventDefault(); // Detiene el refresco automático de la página
               
                // Ocultar alertas previas
                $('#errorAlert').addClass('d-none').text('');

                // Captura los valores de las cajas de texto
                const txtEmail = $('#email').val();
                const txtPassword = $('#password').val();
                // Realiza la llamada asíncrona mediante jQuery AJAX
                $.ajax({
                    url: '/api/usuarios/login', // Ruta exacta de tu UsuarioController
                    type: 'POST',
                    data: {
                        email: txtEmail,
                        password: txtPassword
                    },
                    success: function(usuarioLogueado) {
                        // Si Spring Boot responde exitosamente (Http Status 200 OK)
                       // alert('¡Bienvenido de vuelta, ' + usuarioLogueado.nombre + '!');
                        
                        // Puedes guardarlo en la sesión del navegador si lo deseas
                        sessionStorage.setItem('usuario', JSON.stringify(usuarioLogueado));
                        localStorage.setItem('usuarioId', usuarioLogueado.idusuario);
                        localStorage.setItem('usuarioRol', usuarioLogueado.rol.idroles);
                        localStorage.setItem('usuarioNombre', usuarioLogueado.nombre);

setTimeout(function() {
                            const id = usuarioLogueado.idusuario;
                            const rol = usuarioLogueado.rol.idroles;
                            const nombre = encodeURIComponent(usuarioLogueado.nombre);
                          //  alert('¡Bienvenido de vuelta, con rol ' + JSON.stringify(usuarioLogueado) + '!');

                            // Saltamos al index enviándolos también por la URL como doble respaldo infalible
                            window.location.href = "index.html?id=" + id + "&rol=" + rol + "&nombre=" + nombre;
                        }, 200); 
                      },
                    error: function(xhr) {
                        // Si las credenciales fallan (Http Status 401 Unauthorized)
                        alert(xhr.responseText);
                        $('#errorAlert').removeClass('d-none').text(xhr.responseText);
                    }
                });
            });
        });
    </script>
                   
</body>
